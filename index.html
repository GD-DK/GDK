<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>广东道科档案查询</title>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Microsoft YaHei", "PingFang SC", "Helvetica Neue", Arial, sans-serif;
            background-color: #eef2f7;
            color: #333;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* ===== Header ===== */
        .header {
            width: 100%;
            padding: 40px 20px 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 32px;
            font-weight: 700;
            color: #0a3d7c;
            letter-spacing: 2px;
        }

        .header .subtitle {
            margin-top: 8px;
            font-size: 14px;
            color: #6a8caa;
        }

        /* ===== Data Status Bar ===== */
        .data-status {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 16px;
            padding: 8px 20px;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 2px 8px rgba(10, 61, 124, 0.08);
            font-size: 13px;
            color: #1a5ca6;
        }

        .data-status .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #4a8bcb;
        }

        .data-status.loaded .dot {
            background: #2ecc71;
        }

        .data-status .upload-btn {
            margin-left: 10px;
            padding: 4px 12px;
            background: #1a5ca6;
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 12px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .data-status .upload-btn:hover {
            background: #0a3d7c;
        }

        /* ===== Main Content ===== */
        .main-content {
            flex: 1;
            width: 100%;
            max-width: 800px;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* ===== Search Section ===== */
        .search-section {
            width: 100%;
            display: flex;
            gap: 12px;
            margin-bottom: 30px;
        }

        .search-input {
            flex: 1;
            padding: 16px 24px;
            font-size: 16px;
            border: 2px solid #4a8bcb;
            border-radius: 12px;
            outline: none;
            transition: border-color 0.3s, box-shadow 0.3s;
            background: #ffffff;
            color: #333;
        }

        .search-input::placeholder {
            color: #a0b8d0;
        }

        .search-input:focus {
            border-color: #1a5ca6;
            box-shadow: 0 0 0 3px rgba(26, 92, 166, 0.12);
        }

        .search-btn {
            padding: 16px 36px;
            font-size: 16px;
            font-weight: 600;
            color: #ffffff;
            background: #1a5ca6;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            white-space: nowrap;
        }

        .search-btn:hover {
            background: #0a3d7c;
        }

        .search-btn:active {
            transform: scale(0.97);
        }

        /* ===== Guidance ===== */
        .guidance {
            font-size: 13px;
            color: #8aa4be;
            margin-bottom: 24px;
            text-align: center;
        }

        /* ===== Result Card ===== */
        .result-area {
            width: 100%;
            min-height: 120px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .result-card {
            width: 100%;
            max-width: 500px;
            padding: 32px;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(10, 61, 124, 0.12);
            text-align: center;
            animation: fadeUp 0.4s ease;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(15px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .result-card .label {
            font-size: 14px;
            color: #6a8caa;
            margin-bottom: 12px;
        }

        .result-card .order-num {
            font-size: 15px;
            color: #1a5ca6;
            margin-bottom: 16px;
            font-weight: 500;
        }

        .result-card .board-num {
            font-size: 36px;
            font-weight: 700;
            color: #0a3d7c;
            letter-spacing: 1px;
        }

        .result-card .board-label {
            font-size: 13px;
            color: #8aa4be;
            margin-top: 6px;
        }

        .result-card.not-found {
            border: 2px dashed #ccc;
            box-shadow: none;
            background: transparent;
        }

        .result-card.not-found .msg {
            font-size: 16px;
            color: #999;
        }

        /* ===== Loading Spinner ===== */
        .spinner {
            width: 36px;
            height: 36px;
            border: 3px solid #e0e8f0;
            border-top-color: #1a5ca6;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ===== Admin Link ===== */
        .admin-link {
            position: fixed;
            bottom: 50px;
            right: 30px;
            font-size: 12px;
            color: #4a8bcb;
            cursor: pointer;
            text-decoration: none;
            opacity: 0.6;
            transition: opacity 0.2s, color 0.2s;
            user-select: none;
        }

        .admin-link:hover {
            opacity: 1;
            color: #0a3d7c;
        }

        /* ===== Footer ===== */
        .footer {
            width: 100%;
            padding: 20px;
            text-align: center;
            font-size: 12px;
            color: #aab4c0;
        }

        /* ===== Modal Overlay ===== */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 61, 124, 0.35);
            backdrop-filter: blur(2px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-overlay.active {
            display: flex;
        }

        /* ===== Password Modal ===== */
        .password-modal {
            background: #ffffff;
            border-radius: 16px;
            padding: 36px 40px;
            width: 360px;
            text-align: center;
            box-shadow: 0 8px 40px rgba(10, 61, 124, 0.25);
            animation: fadeUp 0.3s ease;
        }

        .password-modal h3 {
            font-size: 18px;
            color: #0a3d7c;
            margin-bottom: 20px;
        }

        .password-modal input {
            width: 100%;
            padding: 12px 16px;
            font-size: 15px;
            border: 2px solid #4a8bcb;
            border-radius: 10px;
            outline: none;
            text-align: center;
            letter-spacing: 2px;
            transition: border-color 0.3s;
        }

        .password-modal input:focus {
            border-color: #1a5ca6;
        }

        .password-modal .btn-group {
            margin-top: 20px;
            display: flex;
            gap: 12px;
            justify-content: center;
        }

        .password-modal .btn-confirm {
            padding: 10px 28px;
            background: #1a5ca6;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .password-modal .btn-confirm:hover {
            background: #0a3d7c;
        }

        .password-modal .btn-cancel {
            padding: 10px 28px;
            background: transparent;
            color: #999;
            border: none;
            font-size: 14px;
            cursor: pointer;
        }

        .password-modal .btn-cancel:hover {
            color: #666;
        }

        /* ===== Data Table Modal ===== */
        .data-modal {
            background: #ffffff;
            border-radius: 16px;
            width: 90%;
            max-width: 900px;
            height: 80vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 8px 40px rgba(10, 61, 124, 0.25);
            animation: fadeUp 0.3s ease;
            overflow: hidden;
        }

        .data-modal .modal-header {
            padding: 20px 28px;
            border-bottom: 1px solid #e8eef5;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .data-modal .modal-header h3 {
            font-size: 18px;
            color: #0a3d7c;
        }

        .data-modal .modal-header .record-count {
            font-size: 13px;
            color: #8aa4be;
        }

        .data-modal .add-row-bar {
            padding: 12px 28px;
            background: #f5f8fc;
            display: flex;
            gap: 10px;
            align-items: center;
            border-bottom: 1px solid #e8eef5;
        }

        .data-modal .add-row-bar input {
            padding: 8px 14px;
            font-size: 13px;
            border: 1px solid #c5d4e3;
            border-radius: 8px;
            outline: none;
            transition: border-color 0.2s;
        }

        .data-modal .add-row-bar input:focus {
            border-color: #1a5ca6;
        }

        .data-modal .add-row-bar .add-btn {
            padding: 8px 18px;
            background: #1a5ca6;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
            transition: background 0.2s;
            white-space: nowrap;
        }

        .data-modal .add-row-bar .add-btn:hover {
            background: #0a3d7c;
        }

        .data-modal .search-bar {
            padding: 10px 28px;
            background: #fafbfd;
            border-bottom: 1px solid #e8eef5;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .data-modal .search-bar input {
            flex: 1;
            padding: 8px 14px;
            font-size: 13px;
            border: 1px solid #c5d4e3;
            border-radius: 8px;
            outline: none;
        }

        .data-modal .search-bar input:focus {
            border-color: #1a5ca6;
        }

        .data-modal .table-container {
            flex: 1;
            overflow-y: auto;
            overflow-x: auto;
        }

        .data-modal table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        .data-modal thead {
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .data-modal thead th {
            background: #1a5ca6;
            color: #fff;
            padding: 10px 16px;
            text-align: left;
            font-weight: 600;
            white-space: nowrap;
        }

        .data-modal thead th.col-action {
            width: 70px;
            text-align: center;
        }

        .data-modal tbody td {
            padding: 8px 16px;
            border-bottom: 1px solid #eef2f7;
            color: #333;
        }

        .data-modal tbody tr:hover {
            background: #f5f8fc;
        }

        .data-modal tbody td.editable {
            cursor: text;
        }

        .data-modal tbody td.editing {
            padding: 0;
        }

        .data-modal tbody td.editing input {
            width: 100%;
            padding: 8px 16px;
            border: 2px solid #1a5ca6;
            font-size: 13px;
            outline: none;
        }

        .data-modal tbody td.col-action {
            text-align: center;
        }

        .data-modal tbody .delete-btn {
            padding: 4px 10px;
            background: transparent;
            color: #e74c3c;
            border: 1px solid #e74c3c;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .data-modal tbody .delete-btn:hover {
            background: #e74c3c;
            color: #fff;
        }

        .data-modal .modal-footer {
            padding: 16px 28px;
            border-top: 1px solid #e8eef5;
            display: flex;
            gap: 14px;
            justify-content: flex-end;
            align-items: center;
        }

        .data-modal .btn-save {
            padding: 10px 28px;
            background: #1a5ca6;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .data-modal .btn-save:hover {
            background: #0a3d7c;
        }

        .data-modal .btn-export {
            padding: 10px 24px;
            background: #ffffff;
            color: #1a5ca6;
            border: 1.5px solid #1a5ca6;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .data-modal .btn-export:hover {
            background: #f0f6ff;
        }

        .data-modal .btn-cancel-modal {
            padding: 10px 24px;
            background: transparent;
            color: #999;
            border: none;
            font-size: 14px;
            cursor: pointer;
        }

        .data-modal .btn-cancel-modal:hover {
            color: #666;
        }

        /* ===== Pagination ===== */
        .pagination {
            padding: 10px 28px;
            display: flex;
            gap: 6px;
            justify-content: center;
            align-items: center;
            border-top: 1px solid #e8eef5;
            background: #fafbfd;
        }

        .pagination button {
            padding: 6px 12px;
            border: 1px solid #c5d4e3;
            background: #fff;
            color: #1a5ca6;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .pagination button:hover:not(:disabled) {
            background: #1a5ca6;
            color: #fff;
        }

        .pagination button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .pagination button.active {
            background: #1a5ca6;
            color: #fff;
        }

        .pagination .page-info {
            font-size: 12px;
            color: #8aa4be;
            margin: 0 8px;
        }

        /* ===== Toast ===== */
        .toast-container {
            position: fixed;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 2000;
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: center;
        }

        .toast {
            padding: 12px 28px;
            border-radius: 10px;
            font-size: 14px;
            color: #fff;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
            animation: toastIn 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .toast.success {
            background: #1a5ca6;
        }

        .toast.error {
            background: #e74c3c;
        }

        .toast.info {
            background: #4a8bcb;
        }

        .toast.fade-out {
            animation: toastOut 0.3s ease forwards;
        }

        @keyframes toastIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes toastOut {
            to {
                opacity: 0;
                transform: translateY(-20px);
            }
        }

        /* ===== File Input Hidden ===== */
        #fileInput {
            display: none;
        }

        /* ===== Responsive ===== */
        @media (max-width: 600px) {
            .header h1 {
                font-size: 24px;
            }
            .search-section {
                flex-direction: column;
            }
            .search-btn {
                width: 100%;
            }
            .data-modal {
                width: 95%;
                height: 85vh;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <div class="header">
        <h1>广东道科档案查询</h1>
        <div class="subtitle">档案位置快速检索系统</div>
        <div class="data-status" id="dataStatus">
            <span class="dot"></span>
            <span id="statusText">等待加载数据...</span>
            <button class="upload-btn" onclick="document.getElementById('fileInput').click()">上传Excel</button>
        </div>
    </div>

    <!-- Hidden File Input -->
    <input type="file" id="fileInput" accept=".xlsx,.xls" />

    <!-- Main Content -->
    <div class="main-content">
        <!-- Search Section -->
        <div class="search-section">
            <input
                type="text"
                class="search-input"
                id="searchInput"
                placeholder="请输入订单号查询卡板位置"
                onkeydown="if(event.key==='Enter') doSearch()"
            />
            <button class="search-btn" onclick="doSearch()">查询</button>
        </div>

        <!-- Guidance -->
        <div class="guidance" id="guidance">
            请先通过"管理数据"上传Excel表格，或直接开始查询（若已加载数据）
        </div>

        <!-- Result Area -->
        <div class="result-area" id="resultArea"></div>
    </div>

    <!-- Admin Link -->
    <a class="admin-link" onclick="openPasswordModal()">管理数据</a>

    <!-- Footer -->
    <div class="footer">&copy; 2026 广东道科档案管理</div>

    <!-- Password Modal -->
    <div class="modal-overlay" id="passwordOverlay">
        <div class="password-modal">
            <h3>管理员验证</h3>
            <input
                type="password"
                id="passwordInput"
                placeholder="请输入管理密码"
                onkeydown="if(event.key==='Enter') checkPassword()"
            />
            <div class="btn-group">
                <button class="btn-confirm" onclick="checkPassword()">确认</button>
                <button class="btn-cancel" onclick="closePasswordModal()">取消</button>
            </div>
        </div>
    </div>

    <!-- Data Table Modal -->
    <div class="modal-overlay" id="dataOverlay">
        <div class="data-modal">
            <div class="modal-header">
                <h3>数据管理</h3>
                <span class="record-count" id="modalRecordCount">共 0 条记录</span>
            </div>
            <div class="add-row-bar">
                <input type="text" id="newOrder" placeholder="新订单号" style="width: 160px;" />
                <input type="text" id="newBoard" placeholder="新卡板编号" style="width: 140px;" />
                <button class="add-btn" onclick="addNewRow()">+ 添加</button>
            </div>
            <div class="search-bar">
                <input type="text" id="tableSearch" placeholder="在表格中搜索订单号或卡板编号..." oninput="renderTable()" />
            </div>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>序号</th>
                            <th>订单号</th>
                            <th>卡板编号</th>
                            <th class="col-action">操作</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
            <div class="pagination" id="pagination"></div>
            <div class="modal-footer">
                <button class="btn-cancel-modal" onclick="closeDataModal()">取消</button>
                <button class="btn-export" onclick="exportExcel()">导出为新Excel</button>
                <button class="btn-save" onclick="saveChanges()">保存修改</button>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div class="toast-container" id="toastContainer"></div>

                statusEl.classList.add('loaded');
                textEl.textContent = '数据已加载，共 ' + appData.length + ' 条记录';
                document.getElementById('guidance').style.display = 'none';
            } else {
                statusEl.classList.remove('loaded');
                textEl.textContent = '等待加载数据...';
            }
        }

        // ===== File Upload Handler =====
        function handleFileUpload(event) {
            var file = event.target.files[0];
            if (!file) return;

            if (!file.name.match(/\.(xlsx|xls)$/i)) {
                showToast('请上传 .xlsx 或 .xls 格式的文件', 'error');
                return;
            }

            showToast('正在加载文件...', 'info');

            var reader = new FileReader();
            reader.onload = function(e) {
                try {
                    var data = new Uint8Array(e.target.result);
                    var workbook = XLSX.read(data, { type: 'array' });
                    var sheet = workbook.Sheets[workbook.SheetNames[0]];
                    var json = XLSX.utils.sheet_to_json(sheet, { defval: '' });

                    if (json.length === 0) {
                        showToast('文件中没有数据', 'error');
                        return;
                    }

                    // Check required columns
                    var firstRow = json[0];
                    if (!firstRow.hasOwnProperty('订单号') || !firstRow.hasOwnProperty('卡板编号')) {
                        showToast('文件必须包含"订单号"和"卡板编号"两列', 'error');
                        return;
                    }

                    appData = json.map(function(row) {
                        return {
                            "订单号": String(row["订单号"] || ""),
                            "卡板编号": String(row["卡板编号"] || "")
                        };
                    });

                    dataLoaded = true;
                    updateStatus();
                    showToast('数据加载成功，共 ' + appData.length + ' 条记录', 'success');
                    document.getElementById('resultArea').innerHTML = '';
                } catch (err) {
                    showToast('文件读取失败：' + err.message, 'error');
                }
            };
            reader.readAsArrayBuffer(file);
            event.target.value = ''; // Reset input
        }

        // ===== Search =====
        function doSearch() {
            if (!dataLoaded) {
                showToast('请先上传Excel数据文件', 'error');
                return;
            }

            var input = document.getElementById('searchInput');
            var query = input.value.trim();
            if (!query) {
                showToast('请输入订单号', 'info');
                return;
            }

            var resultArea = document.getElementById('resultArea');
            resultArea.innerHTML = '<div class="spinner"></div>';

            // Simulate slight delay for UX
            setTimeout(function() {
                var found = null;
                for (var i = 0; i < appData.length; i++) {
                    if (appData[i]["订单号"] === query) {
                        found = appData[i];
                        break;
                    }
                }

                if (found) {
                    resultArea.innerHTML =
                        '<div class="result-card">' +
                            '<div class="label">查询结果</div>' +
                            '<div class="order-num">订单号：' + escapeHtml(found["订单号"]) + '</div>' +
                            '<div class="board-num">' + escapeHtml(found["卡板编号"]) + '</div>' +
                            '<div class="board-label">卡板编号</div>' +
                        '</div>';
                } else {
                    resultArea.innerHTML =
                        '<div class="result-card not-found">' +
                            '<div class="msg">未找到该订单号，请检查输入。</div>' +
                        '</div>';
                }
            }, 300);
        }

        // ===== Password Modal =====
        function openPasswordModal() {
            document.getElementById('passwordOverlay').classList.add('active');
            var input = document.getElementById('passwordInput');
            input.value = '';
            setTimeout(function() { input.focus(); }, 100);
        }

        function closePasswordModal() {
            document.getElementById('passwordOverlay').classList.remove('active');
        }

        function checkPassword() {
            var pwd = document.getElementById('passwordInput').value;
            if (pwd === 'DK2026') {
                closePasswordModal();
                openDataModal();
            } else {
                showToast('密码错误，无权限修改', 'error');
            }
        }

        // ===== Data Modal =====
        function openDataModal() {
            // Deep copy current data
            modalData = appData.map(function(row) {
                return { "订单号": row["订单号"], "卡板编号": row["卡板编号"] };
            });
            currentPage = 1;
            document.getElementById('tableSearch').value = '';
            document.getElementById('dataOverlay').classList.add('active');
            renderTable();
        }

        function closeDataModal() {
            document.getElementById('dataOverlay').classList.remove('active');
        }

        function getFilteredData() {
            var search = (document.getElementById('tableSearch').value || '').trim().toLowerCase();
            if (!search) return modalData;
            return modalData.filter(function(row) {
                return row["订单号"].toLowerCase().indexOf(search) !== -1 ||
                       row["卡板编号"].toLowerCase().indexOf(search) !== -1;
            });
        }

        function renderTable() {
            var filtered = getFilteredData();
            var totalPages = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));
            if (currentPage > totalPages) currentPage = totalPages;

            var start = (currentPage - 1) * PAGE_SIZE;
            var end = Math.min(start + PAGE_SIZE, filtered.length);
            var pageData = filtered.slice(start, end);

            var tbody = document.getElementById('tableBody');
            var html = '';
            for (var i = 0; i < pageData.length; i++) {
                var idx = modalData.indexOf(pageData[i]);
                html += '<tr>' +
                    '<td>' + (start + i + 1) + '</td>' +
                    '<td class="editable" ondblclick="editCell(this, ' + idx + ', \'订单号\')">' + escapeHtml(pageData[i]["订单号"]) + '</td>' +
                    '<td class="editable" ondblclick="editCell(this, ' + idx + ', \'卡板编号\')">' + escapeHtml(pageData[i]["卡板编号"]) + '</td>' +
                    '<td class="col-action"><button class="delete-btn" onclick="deleteRow(' + idx + ')">删除</button></td>' +
                '</tr>';
            }
            tbody.innerHTML = html;

            // Update record count
            document.getElementById('modalRecordCount').textContent = '共 ' + modalData.length + ' 条记录';

            // Render pagination
            renderPagination(totalPages, filtered.length);
        }

        function renderPagination(totalPages, totalRecords) {
            var pagEl = document.getElementById('pagination');
            if (totalPages <= 1) {
                pagEl.innerHTML = '<span class="page-info">第 1 页 / 共 1 页（' + totalRecords + ' 条）</span>';
                return;
            }

            var html = '';
            html += '<button onclick="goToPage(1)" ' + (currentPage === 1 ? 'disabled' : '') + '>首页</button>';
            html += '<button onclick="goToPage(' + (currentPage - 1) + ')" ' + (currentPage === 1 ? 'disabled' : '') + '>上一页</button>';

            // Show page numbers around current
            var startPage = Math.max(1, currentPage - 2);
            var endPage = Math.min(totalPages, currentPage + 2);
            for (var p = startPage; p <= endPage; p++) {
                html += '<button onclick="goToPage(' + p + ')" class="' + (p === currentPage ? 'active' : '') + '">' + p + '</button>';
            }

            html += '<button onclick="goToPage(' + (currentPage + 1) + ')" ' + (currentPage === totalPages ? 'disabled' : '') + '>下一页</button>';
            html += '<button onclick="goToPage(' + totalPages + ')" ' + (currentPage === totalPages ? 'disabled' : '') + '>末页</button>';
            html += '<span class="page-info">第 ' + currentPage + ' / ' + totalPages + ' 页（' + totalRecords + ' 条）</span>';

            pagEl.innerHTML = html;
        }

        function goToPage(page) {
            currentPage = page;
            renderTable();
        }

        // ===== Edit Cell =====
        function editCell(td, index, field) {
            if (td.classList.contains('editing')) return;

            var currentVal = modalData[index][field];
            td.classList.add('editing');
            td.innerHTML = '<input type="text" value="' + escapeAttr(currentVal) + '" />';

            var input = td.querySelector('input');
            input.focus();
            input.select();

            var saveEdit = function() {
                var newVal = input.value.trim();
                modalData[index][field] = newVal;
                td.classList.remove('editing');
                td.innerHTML = escapeHtml(newVal);
            };

            input.addEventListener('blur', saveEdit);
            input.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    input.blur();
                }
                if (e.key === 'Escape') {
                    td.classList.remove('editing');
                    td.innerHTML = escapeHtml(currentVal);
                }
            });
        }

        // ===== Add Row =====
        function addNewRow() {
            var orderInput = document.getElementById('newOrder');
            var boardInput = document.getElementById('newBoard');
            var order = orderInput.value.trim();
            var board = boardInput.value.trim();

            if (!order || !board) {
                showToast('请填写订单号和卡板编号', 'error');
                return;
            }

            modalData.push({ "订单号": order, "卡板编号": board });
            orderInput.value = '';
            boardInput.value = '';

            // Jump to last page
            var filtered = getFilteredData();
            var totalPages = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));
            currentPage = totalPages;
            renderTable();
            showToast('已添加新记录', 'success');
        }

        // ===== Delete Row =====
        function deleteRow(index) {
            modalData.splice(index, 1);
            renderTable();
            showToast('已删除该行记录', 'info');
        }

        // ===== Save Changes =====
        function saveChanges() {
            appData = modalData.map(function(row) {
                return { "订单号": row["订单号"], "卡板编号": row["卡板编号"] };
            });
            dataLoaded = true;
            updateStatus();
            closeDataModal();
            showToast('数据已更新', 'success');
            document.getElementById('resultArea').innerHTML = '';
            document.getElementById('searchInput').value = '';
        }

        // ===== Export Excel =====
        function exportExcel() {
            try {
                var wsData = [
                    ["订单号", "卡板编号"]
                ];
                for (var i = 0; i < modalData.length; i++) {
                    wsData.push([modalData[i]["订单号"], modalData[i]["卡板编号"]]);
                }

                var ws = XLSX.utils.aoa_to_sheet(wsData);
                ws['!cols'] = [{ wch: 20 }, { wch: 15 }];

                var wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, '档案数据');

                var now = new Date();
                var ts = now.getFullYear() +
                    String(now.getMonth() + 1).padStart(2, '0') +
                    String(now.getDate()).padStart(2, '0') + '_' +
                    String(now.getHours()).padStart(2, '0') +
                    String(now.getMinutes()).padStart(2, '0') +
                    String(now.getSeconds()).padStart(2, '0');
                var fileName = '档案数据_' + ts + '.xlsx';

                XLSX.writeFile(wb, fileName);
                showToast('已导出文件：' + fileName, 'success');
            } catch (err) {
                showToast('导出失败：' + err.message, 'error');
            }
        }

        // ===== Toast =====
        function showToast(message, type) {
            type = type || 'info';
            var container = document.getElementById('toastContainer');
            var toast = document.createElement('div');
            toast.className = 'toast ' + type;
            toast.textContent = message;
            container.appendChild(toast);

            setTimeout(function() {
                toast.classList.add('fade-out');
                setTimeout(function() {
                    if (toast.parentNode) toast.parentNode.removeChild(toast);
                }, 300);
            }, 2500);
        }

        // ===== Utility =====
        function escapeHtml(str) {
            var s = String(str);
            return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        function escapeAttr(str) {
            var s = String(str);
            return s.replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/'/g, '&#39;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }

        // Close modal on overlay click
        document.getElementById('passwordOverlay').addEventListener('click', function(e) {
            if (e.target === this) closePasswordModal();
        });
        document.getElementById('dataOverlay').addEventListener('click', function(e) {
            if (e.target === this) closeDataModal();
        });
    </script>
</body>
</html>
